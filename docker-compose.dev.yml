services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: wahy-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://wahy-backend-dev:9000
      - NEXT_PUBLIC_API_URL=http://localhost:9000
    networks:
      - wahy-network

networks:
  wahy-network:
    name: wahy-network
    driver: bridge
