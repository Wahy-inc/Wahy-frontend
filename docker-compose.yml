services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_URL: ${BACKEND_URL:-http://wahy-backend:9000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:9000}
    container_name: wahy-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=${BACKEND_URL:-http://wahy-backend:9000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:9000}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wahy-frontend.rule=Host(`${FRONTEND_HOST:-app.localhost}`)"
      - "traefik.http.routers.wahy-frontend.entrypoints=websecure"
      - "traefik.http.routers.wahy-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.wahy-frontend.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - wahy-network

networks:
  wahy-network:
    name: wahy-network
    driver: bridge
